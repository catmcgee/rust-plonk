[package]
name = "plonk"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "PLONK from scratch, for learning"
license = "MIT"
publish = false

[dependencies]
ark-ff = "0.5"
ark-ec = "0.5"
ark-poly = "0.5"
ark-serialize = { version = "0.5", features = ["derive"] }
ark-std = "0.5"
sha2 = "0.10"
rand = "0.8"
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
# multi-threaded msm/fft in arkworks and the quotient loop here
parallel = ["rayon", "ark-ff/parallel", "ark-ec/parallel", "ark-poly/parallel", "ark-std/parallel"]

[dev-dependencies]
ark-bls12-381 = "0.5"
rand_chacha = "0.3"
criterion = "0.5"

[[bench]]
name = "prove"
harness = false

# arkworks is unusable unoptimised; keep this crate debuggable but not its deps
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true

[profile.test]
opt-level = 2
